<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" role="img">
  <title>Ellis &amp; Co. Web Design</title>
  <desc>Logo for Ellis &amp; Co. Web Design featuring a geometric E monogram and wordmark</desc>

  <!-- Square mark -->
  <rect x="0" y="0" width="80" height="80" rx="12" fill="#185FA5"/>

  <!-- E letterform: stem + 3 bars with equal 6px gaps -->
  <!-- Stem -->
  <rect x="17" y="16" width="13" height="48" rx="1.5" fill="#ffffff"/>
  <!-- Top bar -->
  <rect x="17" y="16" width="42" height="13" rx="1.5" fill="#ffffff"/>
  <!-- Mid bar (gap=6 below top bar bottom edge 29, height=10) -->
  <rect x="17" y="35" width="32" height="10" rx="1.5" fill="#ffffff"/>
  <!-- Bottom bar (gap=6 below mid bar bottom edge 45) -->
  <rect x="17" y="51" width="42" height="13" rx="1.5" fill="#ffffff"/>

  <!-- Wordmark -->
  <text
    x="96" y="47"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="500"
    letter-spacing="-0.5"
    fill="#0C447C">Ellis &amp; Co.</text>

  <text
    x="97" y="67"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="3"
    fill="#378ADD">WEB DESIGN</text>
</svg>
